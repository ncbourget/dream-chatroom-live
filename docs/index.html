<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
	/>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>dreambox</title>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #111;
			overflow: hidden;
			font-family: Arial, Helvetica, sans-serif;
		}

		#canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		#godot-face-video,
		#godot-face-canvas,
		#godot-image-input,
		#image-convert-canvas {
			display: none;
		}

		.overlay-backdrop {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			box-sizing: border-box;
			background: rgba(17, 17, 17, 0.82);
			backdrop-filter: blur(4px);
		}

		.mobile-panel {
			width: min(92vw, 420px);
			max-height: min(88vh, 900px);
			background: rgba(20, 20, 20, 0.92);
			border: 1px solid rgba(255, 255, 255, 0.12);
			padding: 18px;
			box-sizing: border-box;
			color: white;
			overflow-y: auto;
			overflow-x: hidden;
		}

		#entry-overlay {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			align-items: flex-start;
			justify-content: center;
			padding: 18px 16px;
			box-sizing: border-box;
			background: rgba(17, 17, 17, 0.82);
			backdrop-filter: blur(4px);
			overflow-y: auto;
		}

		#entry-panel {
			width: min(88vw, 330px);
			background: transparent;
			border: 0;
			padding: 0 0 14px 0;
			box-sizing: border-box;
			color: white;
		}

		#entry-title {
			font-size: clamp(34px, 8vw, 46px);
			font-weight: 800;
			line-height: 1;
			margin: 0 0 8px 0;
			text-align: center;
		}

		#entry-subtitle {
			font-size: clamp(15px, 4vw, 20px);
			font-weight: 800;
			opacity: 0.72;
			text-align: center;
			margin-bottom: 12px;
		}

		#player-count {
			color: #00ff1e;
			font-size: clamp(19px, 4.6vw, 24px);
			font-weight: 900;
			text-align: center;
			margin: 0 0 22px 0;
		}

		.entry-field {
			width: 100%;
			box-sizing: border-box;
			margin-bottom: 10px;
		}

		#name-input,
		#pick-image-button,
		#start-button,
		#mic-select {
			width: 100%;
			min-height: 46px;
			box-sizing: border-box;
			border: 0;
			background: #5b5b5b;
			color: white;
			padding: 9px 16px;
			font-size: 17px;
			font-weight: 800;
			border-radius: 22px;
			outline: none;
		}

		#name-input::placeholder {
			color: white;
			opacity: 1;
		}

		#pick-image-button,
		#start-button {
			cursor: pointer;
		}

		#start-button:disabled {
			opacity: 0.45;
			cursor: default;
		}

		#file-name {
			display: none;
		}

		#facecam-row {
			display: flex;
			align-items: center;
			gap: 14px;
			font-size: 17px;
			font-weight: 800;
			margin: 22px 0 28px 0;
		}

		#facecam-checkbox {
			appearance: none;
			width: 28px;
			height: 28px;
			flex: 0 0 auto;
			margin: 0;
			background: #5b5b5b;
			border: 0;
			border-radius: 0;
			cursor: pointer;
		}

		#facecam-checkbox:checked {
			background: white;
			box-shadow: inset 0 0 0 7px #5b5b5b;
		}

		#mic-row {
			display: flex;
			flex-direction: column;
			gap: 12px;
			font-size: 17px;
			font-weight: 800;
			margin-bottom: 28px;
		}

		#preview-wrap {
			width: min(48vw, 170px);
			aspect-ratio: 1 / 1;
			background: #5b5b5b;
			border: 0;
			margin: 0 auto 24px auto;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			position: relative;
			cursor: pointer;
		}

		#preview-wrap::after {
			content: "Click here\A to select\A t-shirt picture";
			white-space: pre;
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			color: white;
			font-size: clamp(15px, 3.8vw, 19px);
			font-weight: 800;
			line-height: 1.2;
			pointer-events: none;
		}

		#preview-wrap.has-image::after {
			display: none;
		}

		#preview-image {
			width: 100%;
			height: 100%;
			object-fit: contain;
			display: none;
			background: #5b5b5b;
		}

		#status-text {
			font-size: 16px;
			min-height: 22px;
			opacity: 1;
			margin-top: 18px;
			font-weight: 800;
		}

		#status-text::first-letter {
			color: #ff1a1a;
		}

		#pick-image-button {
			display: none;
		}

		#start-button {
			margin-top: 0;
			background: white;
			color: #111;
		}

		#voice-debug {
			position: fixed;
			left: 10px;
			bottom: 10px;
			z-index: 10000;
			display: none;
			max-width: min(92vw, 420px);
			background: rgba(0, 0, 0, 0.78);
			color: white;
			font: 12px/1.35 monospace;
			padding: 10px;
			white-space: pre-wrap;
			pointer-events: none;
		}

		#guestbook {
			position: fixed;
			inset: 0;
			display: none;
			z-index: 9999;
			background: rgba(0, 0, 0, 0.82);
			backdrop-filter: blur(4px);
		}

		#guestbook .guestbook-panel {
			width: min(92vw, 420px);
			max-height: min(88vh, 900px);
			background: rgba(20, 20, 20, 0.92);
			border: 1px solid rgba(255, 255, 255, 0.12);
			padding: 18px;
			box-sizing: border-box;
			color: white;
			overflow-y: auto;
			overflow-x: hidden;
		}

		.guestbook-topbar {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 12px;
			margin-bottom: 18px;
		}

		.guestbook-title {
			font-size: clamp(28px, 6vw, 42px);
			line-height: 1;
			font-weight: 700;
			margin: 0;
		}

		#closeGuestbook {
			appearance: none;
			border: 1px solid rgba(255,255,255,0.16);
			background: white;
			color: black;
			padding: 10px 16px;
			font-size: 14px;
			cursor: pointer;
			flex: 0 0 auto;
		}

		#entries {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			column-gap: 16px;
			row-gap: 24px;
			align-content: start;
		}

		.entry {
			border: 1px solid rgba(255,255,255,0.20);
			padding: 12px;
			display: flex;
			flex-direction: column;
			gap: 12px;
			background: rgba(255,255,255,0.03);
			min-width: 0;
		}

		.entry-thumb {
			width: 100%;
			aspect-ratio: 1 / 1;
			overflow: hidden;
			background: #111;
			display: flex;
			align-items: center;
			justify-content: center;
			border: 1px solid rgba(255,255,255,0.06);
		}

		.entry-thumb img {
			width: 100%;
			height: 100%;
			display: block;
			object-fit: contain;
			background: #111;
		}

		.entry-name {
			font-size: 15px;
			font-weight: 700;
			line-height: 1.08;
			word-break: break-word;
		}

		.entry-date {
			font-size: 12px;
			opacity: 0.8;
			line-height: 1.35;
			word-break: break-word;
		}

		.pagination {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 12px;
			padding-top: 18px;
		}

		.pagination button {
			appearance: none;
			border: 1px solid white;
			background: transparent;
			color: white;
			padding: 8px 14px;
			font-size: 14px;
			cursor: pointer;
		}

		.pagination button:disabled {
			opacity: 0.3;
			cursor: default;
		}

		#pageLabel {
			min-width: 110px;
			text-align: center;
			font-size: 14px;
		}

		#guestbookStatus {
			text-align: center;
			font-size: 14px;
			opacity: 0.75;
			min-height: 18px;
			padding-top: 12px;
		}

		#entry-overlay,
		#guestbook,
		#boombox {
			background: rgba(0, 0, 0, 0.82);
			backdrop-filter: blur(4px);
		}

		#entry-overlay {
			align-items: center;
			padding: 20px;
		}

		#entry-panel,
		#guestbook .guestbook-panel,
		#boombox .boombox-panel {
			width: min(92vw, 420px);
			max-height: min(88vh, 900px);
			background: rgba(20, 20, 20, 0.92);
			border: 1px solid rgba(255, 255, 255, 0.12);
			padding: 18px;
			box-sizing: border-box;
			color: white;
			overflow-y: auto;
			overflow-x: hidden;
		}

		#entry-title,
		.guestbook-title,
		.boombox-title {
			font-size: clamp(28px, 6vw, 42px);
			line-height: 1;
			font-weight: 700;
			margin: 0;
			text-align: left;
		}

		#entry-subtitle,
		.boombox-subhead {
			font-size: 16px;
			font-weight: 700;
			opacity: 0.78;
			line-height: 1.25;
			text-align: center;
			margin: 8px 0 10px 0;
		}

		#entry-title,
		#entry-subtitle,
		#player-count {
			text-align: center;
		}

		#player-count {
			font-size: 16px;
			margin: 0 0 18px 0;
		}

		#name-input,
		#pick-image-button,
		#start-button,
		#mic-select,
		#boomboxUrl,
		#submitBoombox {
			border-radius: 0;
			border: 1px solid rgba(255, 255, 255, 0.16);
		}

		#boombox {
			position: fixed;
			inset: 0;
			display: none;
			z-index: 9999;
			align-items: center;
			justify-content: center;
			padding: 20px;
			box-sizing: border-box;
		}

		.boombox-topbar {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 12px;
			margin-bottom: 18px;
		}

		#closeBoombox {
			appearance: none;
			border: 1px solid rgba(255,255,255,0.16);
			background: white;
			color: black;
			padding: 10px 16px;
			font-size: 14px;
			cursor: pointer;
			flex: 0 0 auto;
		}

		#boomboxCurrentTitle {
			color: #ffe600;
			font-size: 18px;
			font-weight: 800;
			line-height: 1.15;
			text-align: center;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			margin-bottom: 18px;
		}

		.boombox-form {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-bottom: 20px;
		}

		#boomboxUrl {
			width: 100%;
			min-height: 46px;
			box-sizing: border-box;
			background: #5b5b5b;
			color: white;
			padding: 9px 16px;
			font-size: 16px;
			font-weight: 800;
			outline: none;
		}

		#boomboxUrl::placeholder {
			color: rgba(255, 255, 255, 0.72);
			opacity: 1;
		}

		#submitBoombox {
			appearance: none;
			width: 100%;
			min-height: 44px;
			background: white;
			color: black;
			font-size: 16px;
			font-weight: 800;
			cursor: pointer;
		}

		#boomboxVoteskip {
			appearance: none;
			width: 100%;
			min-height: 38px;
			border: 1px solid rgba(255, 255, 255, 0.16);
			background: #292929;
			color: white;
			font-size: 14px;
			font-weight: 800;
			cursor: pointer;
			margin-bottom: 18px;
		}

		#boomboxVoteskip:disabled {
			opacity: 0.45;
			cursor: default;
		}

		#enableBoomboxAudio {
			appearance: none;
			width: 100%;
			min-height: 38px;
			border: 1px solid rgba(255, 255, 255, 0.16);
			background: #ffe600;
			color: black;
			font-size: 14px;
			font-weight: 800;
			cursor: pointer;
			display: none;
		}

		#boomboxStatus {
			min-height: 18px;
			font-size: 13px;
			font-weight: 700;
			text-align: center;
			opacity: 0.75;
		}

		.boombox-queue-title {
			font-size: 16px;
			font-weight: 700;
			text-align: center;
			margin-bottom: 12px;
		}

		#boomboxQueue {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.boombox-queue-item {
			border: 1px solid rgba(255,255,255,0.20);
			background: rgba(255,255,255,0.03);
			padding: 10px 12px;
			min-width: 0;
		}

		.boombox-queue-song {
			color: #ffe600;
			font-size: 14px;
			font-weight: 800;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.boombox-queue-user {
			font-size: 12px;
			opacity: 0.78;
			margin-top: 4px;
		}

		#soundcloud-player-wrap {
			position: fixed;
			width: 1px;
			height: 1px;
			left: -100px;
			bottom: -100px;
			overflow: hidden;
			opacity: 0;
			pointer-events: none;
		}

		@media (max-width: 520px) {
			#entry-overlay,
			#guestbook,
			#boombox {
				padding: 16px;
			}

			#entry-panel,
			#guestbook .guestbook-panel,
			#boombox .boombox-panel {
				width: min(92vw, 420px);
			}

			#entry-panel {
				padding: 16px;
			}

			#guestbook .guestbook-panel {
				padding: 16px;
			}

			.guestbook-topbar {
				margin-bottom: 16px;
			}

			#entries {
				column-gap: 16px;
				row-gap: 28px;
			}
		}
	</style>
</head>
<body>
	<div id="entry-overlay">
			<div id="entry-panel">
				<h1 id="entry-title">Dream Chatroom</h1>
				<div id="entry-subtitle">Established April 2026</div>
				<div id="player-count">Players online: X</div>

				<div id="preview-wrap">
				<img id="preview-image" alt="shirt preview" />
			</div>

			<input
				id="name-input"
				class="entry-field"
				type="text"
				placeholder="enter a name..."
				maxlength="20"
				autocomplete="off"
				autocapitalize="none"
				autocorrect="off"
				spellcheck="false"
			/>

			<div id="file-name">no image selected</div>

			<button id="pick-image-button" class="entry-field" type="button">select image</button>

			<label id="facecam-row">
				<input id="facecam-checkbox" type="checkbox" />
				<span>Click to enable webcam</span>
			</label>

			<label id="mic-row">
				<span>Select active microphone</span>
				<select id="mic-select">
					<option value="">detecting microphones...</option>
				</select>
			</label>

			<button id="start-button" class="entry-field" type="button">enter world</button>

			<div id="status-text">* Choose a shirt and name</div>
		</div>
	</div>

	<div id="guestbook" class="overlay-backdrop">
		<div class="guestbook-panel mobile-panel">
			<div class="guestbook-topbar">
				<div class="guestbook-title">Guestbook</div>
				<button id="closeGuestbook" type="button">Close</button>
			</div>

			<div id="entries"></div>

			<div class="pagination">
				<button id="prevPage" type="button">Prev</button>
				<span id="pageLabel">Page 1 / 1</span>
				<button id="nextPage" type="button">Next</button>
			</div>

			<div id="guestbookStatus"></div>
		</div>
	</div>

	<div id="boombox" class="overlay-backdrop">
		<div class="boombox-panel mobile-panel">
			<div class="boombox-topbar">
				<div class="boombox-title">Boombox</div>
				<button id="closeBoombox" type="button">Close</button>
			</div>

			<div class="boombox-subhead">♫ Now playing:</div>
			<div id="boomboxCurrentTitle">Nothing yet</div>

			<div class="boombox-form">
				<input
					id="boomboxUrl"
					type="text"
					placeholder="soundcloud link here"
					autocomplete="off"
					autocapitalize="none"
					autocorrect="off"
					spellcheck="false"
				/>
				<button id="submitBoombox" type="button">add to queue</button>
				<button id="enableBoomboxAudio" type="button">enable boombox audio</button>
				<div id="boomboxStatus"></div>
			</div>

			<button id="boomboxVoteskip" type="button">vote skip</button>
			<div class="boombox-queue-title">Queue</div>
			<div id="boomboxQueue"></div>
		</div>
	</div>

	<input id="godot-image-input" type="file" accept="image/*" />

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<video id="godot-face-video" autoplay playsinline muted></video>
	<canvas id="godot-face-canvas"></canvas>
	<canvas id="image-convert-canvas"></canvas>
	<div id="voice-debug"></div>
	<div id="soundcloud-player-wrap">
		<iframe
			id="soundcloud-player"
			width="100%"
			height="100%"
			scrolling="no"
			frameborder="no"
			allow="autoplay"
			src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com"
		></iframe>
	</div>

	<script src="https://w.soundcloud.com/player/api.js"></script>
	<script>
		const BUILD_TAG = "v20-proximity-voice-mic-select";
		const GUESTBOOK_API_BASE = "https://dream-chatroom.onrender.com";

		const overlay = document.getElementById("entry-overlay");
		const nameInput = document.getElementById("name-input");
		const pickImageButton = document.getElementById("pick-image-button");
		const startButton = document.getElementById("start-button");
		const facecamCheckbox = document.getElementById("facecam-checkbox");
		const micSelect = document.getElementById("mic-select");
		const fileName = document.getElementById("file-name");
		const statusText = document.getElementById("status-text");
		const previewImage = document.getElementById("preview-image");
		const playerCount = document.getElementById("player-count");
		const gameCanvas = document.getElementById("canvas");
		const boomboxPanel = document.getElementById("boombox");
		const boomboxUrl = document.getElementById("boomboxUrl");
		const boomboxCurrentTitle = document.getElementById("boomboxCurrentTitle");
		const boomboxQueue = document.getElementById("boomboxQueue");
		const boomboxStatus = document.getElementById("boomboxStatus");
		const enableBoomboxAudio = document.getElementById("enableBoomboxAudio");
		const boomboxVoteskip = document.getElementById("boomboxVoteskip");
		const soundcloudIframe = document.getElementById("soundcloud-player");

		const godotImageInput = document.getElementById("godot-image-input");
		const godotFaceVideo = document.getElementById("godot-face-video");
		const godotFaceCanvas = document.getElementById("godot-face-canvas");
		const godotFaceCtx = godotFaceCanvas.getContext("2d", { willReadFrequently: true });
		const imageConvertCanvas = document.getElementById("image-convert-canvas");
		const imageConvertCtx = imageConvertCanvas.getContext("2d");
		const voiceDebug = document.getElementById("voice-debug");

		let godotFaceStream = null;
		let godotFaceSize = 80;
		let selectedImageDataUrl = "";
		let selectedImageName = "";

			let currentPage = 1;
			let totalPages = 1;
			window.lastMessage = "";
			let godotSessionStarted = false;
			let godotHiddenAt = 0;
			let godotResumeReloadThresholdMs = 8000;

			let selectedMicDeviceId = "";
			let godotVoiceAudioContext = null;
			let godotVoiceStream = null;
			let godotVoiceSource = null;
			let godotVoiceProcessor = null;
			let godotVoiceSilentGain = null;
			let godotVoiceOutgoingPackets = [];
			let godotVoicePositions = {};
			let godotVoiceLocalId = "";
			let godotVoicePlaybackTimes = {};
			let godotVoiceEnabled = false;
			let godotVoiceCapturedPacketCount = 0;
			let godotVoicePlayedPacketCount = 0;
			let godotVoiceLastPeak = 0;
			let godotVoiceLastPacketTime = 0;
			let godotVoiceLastPlayedPeer = "";
			let godotVoiceNextPacketTime = 0;
			let godotVoiceHoldUntil = 0;
			let godotVoiceTargetSampleRate = 8000;
			let godotVoicePacketIntervalSec = 0.08;
			let godotVoiceSilenceThreshold = 0.0025;
			let godotVoiceHoldSec = 0.35;
			let godotVoiceMaxDistance = 32.0;
			let godotVoiceMinDistance = 4.0;
			let godotVoiceBaseVolume = 1.0;
			let boomboxSubmissions = [];
			let boomboxVoteskipRequests = 0;
			let boomboxState = {
				current: null,
				queue: [],

		async function convertFileToJpegDataUrl(file) {
			return new Promise((resolve, reject) => {
				const objectUrl = URL.createObjectURL(file);
				const img = new Image();

				img.onload = () => {
					try {
						const maxSize = 128;
						imageConvertCanvas.width = maxSize;
						imageConvertCanvas.height = maxSize;

						imageConvertCtx.clearRect(0, 0, maxSize, maxSize);

						const srcW = img.naturalWidth || img.width;
						const srcH = img.naturalHeight || img.height;
						const square = Math.min(srcW, srcH);
						const sx = Math.floor((srcW - square) * 0.5);
						const sy = Math.floor((srcH - square) * 0.5);

						imageConvertCtx.drawImage(
							img,
							sx, sy, square, square,
							0, 0, maxSize, maxSize
						);

						const jpegDataUrl = imageConvertCanvas.toDataURL("image/jpeg", 0.72);
						URL.revokeObjectURL(objectUrl);
						resolve(jpegDataUrl);
					} catch (err) {
						URL.revokeObjectURL(objectUrl);
						reject(err);
					}
				};

				img.onerror = (err) => {
					URL.revokeObjectURL(objectUrl);
					reject(err);
				};

				img.src = objectUrl;
			});
		}

		function getBoomboxVolume() {
			if (!boomboxLocalPosition || !boomboxPosition) {
				return boomboxBaseVolume;
			}

			const dx = Number(boomboxLocalPosition.x || 0) - Number(boomboxPosition.x || 0);
			const dy = Number(boomboxLocalPosition.y || 0) - Number(boomboxPosition.y || 0);
			const dz = Number(boomboxLocalPosition.z || 0) - Number(boomboxPosition.z || 0);
			const distance = Math.sqrt((dx * dx) + (dy * dy) + (dz * dz));

			if (distance <= boomboxMinDistance) {
				return boomboxBaseVolume;
			}

			if (distance >= boomboxMaxDistance) {
				return 0.0;
			}

			const t = (distance - boomboxMinDistance) / (boomboxMaxDistance - boomboxMinDistance);
			const eased = 1.0 - Math.min(1.0, Math.max(0.0, t));
			return Math.sin(eased * Math.PI * 0.5) * boomboxBaseVolume;
		}

		function correctBoomboxDrift() {
			if (!boomboxWidget || !boomboxWidgetReady || !boomboxState.current || !boomboxAudioUnlocked) {
				return;
			}

			const now = Date.now();
			if (now - boomboxLastDriftCorrection < 5000) {
				return;
			}

			boomboxLastDriftCorrection = now;
			boomboxWidget.getPosition(function (position) {
				const expected = getBoomboxElapsedMs();
				if (Math.abs(Number(position || 0) - expected) > 1500) {
					boomboxWidget.seekTo(expected);
				}
			});
		}

			if (!current || !current.url) {
				boomboxLoadedTrackId = "";
				boomboxLoadedUrl = "";
				boomboxCurrentTitleText = "";
				boomboxWidget.pause();
				renderBoomboxState();
				return;
			}

			const trackId = String(current.id || current.url || "");

			if (trackId === boomboxLoadedTrackId && current.url === boomboxLoadedUrl) {
				updateBoomboxVolume();
				return;
			}

			boomboxLoadedTrackId = trackId;
			boomboxLoadedUrl = current.url;
			boomboxCurrentTitleText = "";
			renderBoomboxState();

			boomboxWidget.load(current.url, {
				auto_play: boomboxAudioUnlocked,
				show_artwork: false,
				visual: false,
				callback: function () {
					updateBoomboxVolume();
					seekBoomboxToCurrentTime();
					if (boomboxAudioUnlocked) {
						boomboxWidget.play();
					}
					boomboxWidget.getCurrentSound(function (sound) {
						if (sound && sound.title) {
							boomboxCurrentTitleText = sound.title;
							renderBoomboxState();
						}
					});
				}
			});
		}

		async function unlockVoiceAudio() {

			if (!ContextClass) {
				return false;

			if (!godotVoiceAudioContext) {
				godotVoiceAudioContext = new ContextClass();

		async function testGodotAudio() {
			const ok = await unlockVoiceAudio();

			if (!ok || !godotVoiceAudioContext) {
				return false;
			}

			const oscillator = godotVoiceAudioContext.createOscillator();
			const gain = godotVoiceAudioContext.createGain();

			oscillator.type = "sine";
			oscillator.frequency.value = 660;
			gain.gain.setValueAtTime(0.001, godotVoiceAudioContext.currentTime);
			gain.gain.exponentialRampToValueAtTime(0.18, godotVoiceAudioContext.currentTime + 0.02);
			gain.gain.exponentialRampToValueAtTime(0.001, godotVoiceAudioContext.currentTime + 0.22);

			oscillator.connect(gain);
			gain.connect(godotVoiceAudioContext.destination);
			oscillator.start();
			oscillator.stop(godotVoiceAudioContext.currentTime + 0.24);

			return true;
		}

		async function startGodotVoiceChat() {
			if (godotVoiceEnabled) {
				return true;
			}

			if (selectedMicDeviceId === "__none__") {
				godotVoiceEnabled = false;
				return true;
			}

			if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
				statusText.textContent = "* Microphone unavailable";
				return false;
			}

			try {
				await unlockVoiceAudio();

				if (godotVoiceStream) {
					godotVoiceStream.getTracks().forEach(track => track.stop());
					godotVoiceStream = null;
				}

				const audioSettings = {
					echoCancellation: true,
					noiseSuppression: true,
					autoGainControl: true,
					channelCount: 1
				};

				if (selectedMicDeviceId && selectedMicDeviceId !== "__none__") {
					audioSettings.deviceId = { exact: selectedMicDeviceId };
				}

				godotVoiceStream = await navigator.mediaDevices.getUserMedia({
					audio: audioSettings,
					video: false
				});

				await populateMicrophoneSelect();

				const activeTrack = godotVoiceStream.getAudioTracks()[0];

				if (activeTrack && activeTrack.getSettings().deviceId) {
					selectedMicDeviceId = activeTrack.getSettings().deviceId;
					micSelect.value = selectedMicDeviceId;
					}

					godotVoiceSource = godotVoiceAudioContext.createMediaStreamSource(godotVoiceStream);
					godotVoiceProcessor = godotVoiceAudioContext.createScriptProcessor(4096, 1, 1);
					godotVoiceSilentGain = godotVoiceAudioContext.createGain();
					godotVoiceSilentGain.gain.value = 0;

					godotVoiceProcessor.onaudioprocess = function (event) {
						if (!godotVoiceEnabled) {
							return;
						}

						const now = godotVoiceAudioContext.currentTime;

						if (now < godotVoiceNextPacketTime) {
							return;
						}

						const input = event.inputBuffer.getChannelData(0);
						let peak = 0;

						for (let i = 0; i < input.length; i++) {
							const value = Math.abs(input[i]);

							if (value > peak) {
								peak = value;
							}
						}

						godotVoiceLastPeak = peak;

						if (peak >= godotVoiceSilenceThreshold) {
							godotVoiceHoldUntil = now + godotVoiceHoldSec;
						}

						if (peak < godotVoiceSilenceThreshold && now > godotVoiceHoldUntil) {
							godotVoiceNextPacketTime = now + godotVoicePacketIntervalSec;
							return;
						}

						const sourceRate = godotVoiceAudioContext.sampleRate;
						const step = Math.max(1, sourceRate / godotVoiceTargetSampleRate);
