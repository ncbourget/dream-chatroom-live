<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
	/>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>dreambox</title>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #111;
			overflow: hidden;
			font-family: Arial, Helvetica, sans-serif;
		}

		#canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		#godot-face-video,
		#godot-face-canvas,
		#godot-image-input,
		#image-convert-canvas {
			display: none;
		}

		.overlay-backdrop {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			box-sizing: border-box;
			background: rgba(17, 17, 17, 0.82);
			backdrop-filter: blur(4px);
		}

		.mobile-panel {
			width: min(92vw, 420px);
			max-height: min(88vh, 900px);
			background: rgba(20, 20, 20, 0.92);
			border: 1px solid rgba(255, 255, 255, 0.12);
			padding: 18px;
			box-sizing: border-box;
			color: white;
			overflow-y: auto;
			overflow-x: hidden;
		}

		#entry-overlay {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			align-items: flex-start;
			justify-content: center;
			padding: 18px 16px;
			box-sizing: border-box;
			background: rgba(17, 17, 17, 0.82);
			backdrop-filter: blur(4px);
			overflow-y: auto;
		}

		#entry-panel {
			width: min(88vw, 330px);
			background: transparent;
			border: 0;
			padding: 0 0 14px 0;
			box-sizing: border-box;
			color: white;
		}

		#entry-title {
			font-size: clamp(34px, 8vw, 46px);
			font-weight: 800;
			line-height: 1;
			margin: 0 0 8px 0;
			text-align: center;
		}

		#entry-subtitle {
			font-size: clamp(15px, 4vw, 20px);
			font-weight: 800;
			opacity: 0.72;
			text-align: center;
			margin-bottom: 24px;
		}

		.entry-field {
			width: 100%;
			box-sizing: border-box;
			margin-bottom: 10px;
		}

		#name-input,
		#pick-image-button,
		#start-button,
		#mic-select {
			width: 100%;
			min-height: 46px;
			box-sizing: border-box;
			border: 0;
			background: #5b5b5b;
			color: white;
			padding: 9px 16px;
			font-size: 17px;
			font-weight: 800;
			border-radius: 22px;
			outline: none;
		}

		#name-input::placeholder {
			color: white;
			opacity: 1;
		}

		#pick-image-button,
		#start-button {
			cursor: pointer;
		}

		#start-button:disabled {
			opacity: 0.45;
			cursor: default;
		}

		#file-name {
			display: none;
		}

		#facecam-row {
			display: flex;
			align-items: center;
			gap: 14px;
			font-size: 17px;
			font-weight: 800;
			margin: 22px 0 28px 0;
		}

		#facecam-checkbox {
			appearance: none;
			width: 28px;
			height: 28px;
			flex: 0 0 auto;
			margin: 0;
			background: #5b5b5b;
			border: 0;
			border-radius: 0;
			cursor: pointer;
		}

		#facecam-checkbox:checked {
			background: white;
			box-shadow: inset 0 0 0 7px #5b5b5b;
		}

		#mic-row {
			display: flex;
			flex-direction: column;
			gap: 12px;
			font-size: 17px;
			font-weight: 800;
			margin-bottom: 28px;
		}

		#preview-wrap {
			width: min(48vw, 170px);
			aspect-ratio: 1 / 1;
			background: #5b5b5b;
			border: 0;
			margin: 0 auto 24px auto;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			position: relative;
			cursor: pointer;
		}

		#preview-wrap::after {
			content: "Click here\A to select\A t-shirt picture";
			white-space: pre;
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			color: white;
			font-size: clamp(15px, 3.8vw, 19px);
			font-weight: 800;
			line-height: 1.2;
			pointer-events: none;
		}

		#preview-wrap.has-image::after {
			display: none;
		}

		#preview-image {
			width: 100%;
			height: 100%;
			object-fit: contain;
			display: none;
			background: #5b5b5b;
		}

		#status-text {
			font-size: 16px;
			min-height: 22px;
			opacity: 1;
			margin-top: 18px;
			font-weight: 800;
		}

		#status-text::first-letter {
			color: #ff1a1a;
		}

		#pick-image-button {
			display: none;
		}

		#start-button {
			margin-top: 0;
			background: white;
			color: #111;
		}

		#guestbook {
			position: fixed;
			inset: 0;
			display: none;
			z-index: 9999;
			background: rgba(0, 0, 0, 0.82);
			backdrop-filter: blur(4px);
		}

		#guestbook .guestbook-panel {
			width: min(92vw, 420px);
			max-height: min(88vh, 900px);
			background: rgba(20, 20, 20, 0.92);
			border: 1px solid rgba(255, 255, 255, 0.12);
			padding: 18px;
			box-sizing: border-box;
			color: white;
			overflow-y: auto;
			overflow-x: hidden;
		}

		.guestbook-topbar {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 12px;
			margin-bottom: 18px;
		}

		.guestbook-title {
			font-size: clamp(28px, 6vw, 42px);
			line-height: 1;
			font-weight: 700;
			margin: 0;
		}

		#closeGuestbook {
			appearance: none;
			border: 1px solid rgba(255,255,255,0.16);
			background: white;
			color: black;
			padding: 10px 16px;
			font-size: 14px;
			cursor: pointer;
			flex: 0 0 auto;
		}

		#entries {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			column-gap: 16px;
			row-gap: 24px;
			align-content: start;
		}

		.entry {
			border: 1px solid rgba(255,255,255,0.20);
			padding: 12px;
			display: flex;
			flex-direction: column;
			gap: 12px;
			background: rgba(255,255,255,0.03);
			min-width: 0;
		}

		.entry-thumb {
			width: 100%;
			aspect-ratio: 1 / 1;
			overflow: hidden;
			background: #111;
			display: flex;
			align-items: center;
			justify-content: center;
			border: 1px solid rgba(255,255,255,0.06);
		}

		.entry-thumb img {
			width: 100%;
			height: 100%;
			display: block;
			object-fit: contain;
			background: #111;
		}

		.entry-name {
			font-size: 15px;
			font-weight: 700;
			line-height: 1.08;
			word-break: break-word;
		}

		.entry-date {
			font-size: 12px;
			opacity: 0.8;
			line-height: 1.35;
			word-break: break-word;
		}

		.pagination {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 12px;
			padding-top: 18px;
		}

		.pagination button {
			appearance: none;
			border: 1px solid white;
			background: transparent;
			color: white;
			padding: 8px 14px;
			font-size: 14px;
			cursor: pointer;
		}

		.pagination button:disabled {
			opacity: 0.3;
			cursor: default;
		}

		#pageLabel {
			min-width: 110px;
			text-align: center;
			font-size: 14px;
		}

		#guestbookStatus {
			text-align: center;
			font-size: 14px;
			opacity: 0.75;
			min-height: 18px;
			padding-top: 12px;
		}

		@media (max-width: 520px) {
			#entry-overlay,
			#guestbook {
				padding: 16px;
			}

			#entry-panel,
			#guestbook .guestbook-panel {
				width: min(92vw, 420px);
			}

			#entry-panel {
				width: min(88vw, 330px);
				padding: 0 0 14px 0;
			}

			#guestbook .guestbook-panel {
				padding: 16px;
			}

			.guestbook-topbar {
				margin-bottom: 16px;
			}

			#entries {
				column-gap: 16px;
				row-gap: 28px;
			}
		}
	</style>
</head>
<body>
	<div id="entry-overlay">
		<div id="entry-panel">
			<h1 id="entry-title">Dream Chatroom</h1>
			<div id="entry-subtitle">Established April 2026</div>

			<div id="preview-wrap">
				<img id="preview-image" alt="shirt preview" />
			</div>

			<input
				id="name-input"
				class="entry-field"
				type="text"
				placeholder="enter a name..."
				maxlength="20"
				autocomplete="off"
				autocapitalize="none"
				autocorrect="off"
				spellcheck="false"
			/>

			<div id="file-name">no image selected</div>

			<button id="pick-image-button" class="entry-field" type="button">select image</button>

			<label id="facecam-row">
				<input id="facecam-checkbox" type="checkbox" />
				<span>Click to enable webcam</span>
			</label>

			<label id="mic-row">
				<span>Select active microphone</span>
				<select id="mic-select">
					<option value="">detecting microphones...</option>
				</select>
			</label>

			<button id="start-button" class="entry-field" type="button">enter world</button>

			<div id="status-text">* Choose a shirt and name</div>
		</div>
	</div>

	<div id="guestbook" class="overlay-backdrop">
		<div class="guestbook-panel mobile-panel">
			<div class="guestbook-topbar">
				<div class="guestbook-title">Guestbook</div>
				<button id="closeGuestbook" type="button">Close</button>
			</div>

			<div id="entries"></div>

			<div class="pagination">
				<button id="prevPage" type="button">Prev</button>
				<span id="pageLabel">Page 1 / 1</span>
				<button id="nextPage" type="button">Next</button>
			</div>

			<div id="guestbookStatus"></div>
		</div>
	</div>

	<input id="godot-image-input" type="file" accept="image/*" />

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<video id="godot-face-video" autoplay playsinline muted></video>
	<canvas id="godot-face-canvas"></canvas>
	<canvas id="image-convert-canvas"></canvas>

	<script>
		const BUILD_TAG = "v20-proximity-voice-mic-select";
		const GUESTBOOK_API_BASE = "https://dream-chatroom.onrender.com";

		const overlay = document.getElementById("entry-overlay");
		const nameInput = document.getElementById("name-input");
		const pickImageButton = document.getElementById("pick-image-button");
		const startButton = document.getElementById("start-button");
		const facecamCheckbox = document.getElementById("facecam-checkbox");
		const micSelect = document.getElementById("mic-select");
		const fileName = document.getElementById("file-name");
		const statusText = document.getElementById("status-text");
		const previewImage = document.getElementById("preview-image");

		const godotImageInput = document.getElementById("godot-image-input");
		const godotFaceVideo = document.getElementById("godot-face-video");
		const godotFaceCanvas = document.getElementById("godot-face-canvas");
		const godotFaceCtx = godotFaceCanvas.getContext("2d", { willReadFrequently: true });
		const imageConvertCanvas = document.getElementById("image-convert-canvas");
		const imageConvertCtx = imageConvertCanvas.getContext("2d");

		let godotFaceStream = null;
		let godotFaceSize = 80;
		let selectedImageDataUrl = "";
		let selectedImageName = "";

		let currentPage = 1;
		let totalPages = 1;
		window.lastMessage = "";

		let selectedMicDeviceId = "";
		let godotVoiceAudioContext = null;
		let godotVoiceStream = null;
		let godotVoiceRecorder = null;
		let godotVoiceOutgoingPackets = [];
		let godotVoicePositions = {};
		let godotVoiceLocalId = "";
		let godotVoiceAudios = {};
		let godotVoiceEnabled = false;
		let godotVoiceMaxDistance = 15.0;
		let godotVoiceMinDistance = 2.0;
		let godotVoiceBaseVolume = 1.0;

		function updateStartState() {
			const hasName = nameInput.value.trim().length > 0;
			const hasImage = selectedImageDataUrl !== "";

			startButton.disabled = !(hasName && hasImage);

			if (hasName && hasImage) {
				statusText.textContent = "* Ready";
			} else if (!hasName && !hasImage) {
				statusText.textContent = "* Choose a shirt and name";
			} else if (!hasName) {
				statusText.textContent = "* Enter a name";
			} else {
				statusText.textContent = "* Choose a shirt";
			}
		}

		async function convertFileToJpegDataUrl(file) {
			return new Promise((resolve, reject) => {
				const objectUrl = URL.createObjectURL(file);
				const img = new Image();

				img.onload = () => {
					try {
						const maxSize = 128;
						imageConvertCanvas.width = maxSize;
						imageConvertCanvas.height = maxSize;

						imageConvertCtx.clearRect(0, 0, maxSize, maxSize);

						const srcW = img.naturalWidth || img.width;
						const srcH = img.naturalHeight || img.height;
						const square = Math.min(srcW, srcH);
						const sx = Math.floor((srcW - square) * 0.5);
						const sy = Math.floor((srcH - square) * 0.5);

						imageConvertCtx.drawImage(
							img,
							sx, sy, square, square,
							0, 0, maxSize, maxSize
						);

						const jpegDataUrl = imageConvertCanvas.toDataURL("image/jpeg", 0.72);
						URL.revokeObjectURL(objectUrl);
						resolve(jpegDataUrl);
					} catch (err) {
						URL.revokeObjectURL(objectUrl);
						reject(err);
					}
				};

				img.onerror = (err) => {
					URL.revokeObjectURL(objectUrl);
					reject(err);
				};

				img.src = objectUrl;
			});
		}

		function formatJoinedAt(timestamp) {
			const date = new Date(timestamp);
			return date.toLocaleString();
		}

		function setGuestbookStatus(text) {
			document.getElementById("guestbookStatus").textContent = text || "";
		}

		function escapeHtml(value) {
			return String(value)
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;")
				.replaceAll("'", "&#039;");
		}

		function renderGuestbookEntries(data) {
			const container = document.getElementById("entries");
			container.innerHTML = "";

			if (!data.entries || data.entries.length === 0) {
				setGuestbookStatus("No entries yet.");
			} else {
				setGuestbookStatus("");
			}

			for (const entry of data.entries) {
				const div = document.createElement("div");
				div.className = "entry";

				div.innerHTML = `
					<div class="entry-thumb">
						<img src="${escapeHtml(entry.shirt_url)}" alt="${escapeHtml(entry.name)}" loading="lazy">
					</div>
					<div class="entry-name">${escapeHtml(entry.name)}</div>
					<div class="entry-date">${escapeHtml(formatJoinedAt(entry.joined_at))}</div>
				`;

				container.appendChild(div);
			}
		}

		function updatePaginationUI() {
			document.getElementById("pageLabel").textContent = `Page ${currentPage} / ${totalPages}`;
			document.getElementById("prevPage").disabled = currentPage <= 1;
			document.getElementById("nextPage").disabled = currentPage >= totalPages;
		}

		async function loadGuestbook(page = 1) {
			try {
				setGuestbookStatus("Loading...");
				const res = await fetch(`${GUESTBOOK_API_BASE}/api/guestbook?page=${page}`, {
					cache: "no-store"
				});

				if (!res.ok) {
					throw new Error(`HTTP ${res.status}`);
				}

				const data = await res.json();

				currentPage = Number(data.page || 1);
				totalPages = Math.max(1, Number(data.total_pages || 1));

				renderGuestbookEntries(data);
				updatePaginationUI();
			} catch (err) {
				console.error("Guestbook fetch failed:", err);
				document.getElementById("entries").innerHTML = "";
				setGuestbookStatus("Could not load guestbook.");
				currentPage = 1;
				totalPages = 1;
				updatePaginationUI();
			}
		}

		function showGuestbook() {
			document.getElementById("guestbook").style.display = "flex";
			window.lastMessage = "";
			loadGuestbook(1);
		}

		function hideGuestbook() {
			document.getElementById("guestbook").style.display = "none";
			window.lastMessage = "guestbook_closed";
		}

		window.showGuestbook = showGuestbook;
		window.hideGuestbook = hideGuestbook;

		window.openGodotImagePicker = function () {
			godotImageInput.value = "";
			godotImageInput.click();
		};

		pickImageButton.addEventListener("click", function () {
			window.openGodotImagePicker();
		});

		document.getElementById("preview-wrap").addEventListener("click", function () {
			window.openGodotImagePicker();
		});

		godotImageInput.addEventListener("change", async function () {
			const file = godotImageInput.files && godotImageInput.files[0];
			if (!file) return;

			try {
				const jpegDataUrl = await convertFileToJpegDataUrl(file);

				selectedImageDataUrl = jpegDataUrl;
				selectedImageName = file.name || "image.jpg";

				fileName.textContent = selectedImageName;
				previewImage.src = selectedImageDataUrl;
				previewImage.style.display = "block";
				document.getElementById("preview-wrap").classList.add("has-image");

				updateStartState();
			} catch (err) {
				console.error("[dreambox]", BUILD_TAG, "Image conversion failed:", err);
				selectedImageDataUrl = "";
				selectedImageName = "";
				fileName.textContent = "no image selected";
				previewImage.src = "";
				previewImage.style.display = "none";
				document.getElementById("preview-wrap").classList.remove("has-image");
				statusText.textContent = "* Could not load image";
				updateStartState();
			}
		});

		nameInput.addEventListener("input", updateStartState);

		function getSupportedVoiceMimeType() {
			const types = [
				"audio/webm;codecs=opus",
				"audio/webm",
				"audio/mp4",
				"audio/aac"
			];

			if (typeof MediaRecorder === "undefined") {
				return "";
			}

			for (const type of types) {
				if (MediaRecorder.isTypeSupported(type)) {
					return type;
				}
			}

			return "";
		}

		function blobToDataUrl(blob) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();

				reader.onloadend = () => {
					resolve(String(reader.result || ""));
				};

				reader.onerror = reject;
				reader.readAsDataURL(blob);
			});
		}

		async function unlockVoiceAudio() {
			const ContextClass = window.AudioContext || window.webkitAudioContext;

			if (!ContextClass) {
				return false;
			}

			if (!godotVoiceAudioContext) {
				godotVoiceAudioContext = new ContextClass();
			}

			if (godotVoiceAudioContext.state === "suspended") {
				await godotVoiceAudioContext.resume();
			}

			return true;
		}

		async function testGodotAudio() {
			const ok = await unlockVoiceAudio();

			if (!ok || !godotVoiceAudioContext) {
				return false;
			}

			const oscillator = godotVoiceAudioContext.createOscillator();
			const gain = godotVoiceAudioContext.createGain();

			oscillator.type = "sine";
			oscillator.frequency.value = 660;
			gain.gain.setValueAtTime(0.001, godotVoiceAudioContext.currentTime);
			gain.gain.exponentialRampToValueAtTime(0.18, godotVoiceAudioContext.currentTime + 0.02);
			gain.gain.exponentialRampToValueAtTime(0.001, godotVoiceAudioContext.currentTime + 0.22);

			oscillator.connect(gain);
			gain.connect(godotVoiceAudioContext.destination);
			oscillator.start();
			oscillator.stop(godotVoiceAudioContext.currentTime + 0.24);

			return true;
		}

		async function populateMicrophoneSelect() {
			if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
				micSelect.innerHTML = "";
				const option = document.createElement("option");
				option.value = "__none__";
				option.textContent = "no mic selected";
				micSelect.appendChild(option);
				selectedMicDeviceId = "__none__";
				return;
			}

			try {
				const currentValue = micSelect.value;
				const devices = await navigator.mediaDevices.enumerateDevices();
				const microphones = devices.filter(device => device.kind === "audioinput");

				micSelect.innerHTML = "";

				const noneOption = document.createElement("option");
				noneOption.value = "__none__";
				noneOption.textContent = "no mic selected";
				micSelect.appendChild(noneOption);

				for (let i = 0; i < microphones.length; i++) {
					const device = microphones[i];
					const option = document.createElement("option");
					option.value = device.deviceId;
					option.textContent = device.label || `microphone ${i + 1}`;
					micSelect.appendChild(option);
				}

				if (currentValue && Array.from(micSelect.options).some(option => option.value === currentValue)) {
					selectedMicDeviceId = currentValue;
					micSelect.value = currentValue;
				} else if (microphones.length > 0) {
					selectedMicDeviceId = microphones[0].deviceId;
					micSelect.value = selectedMicDeviceId;
				} else {
					selectedMicDeviceId = "__none__";
					micSelect.value = "__none__";
				}
			} catch (err) {
				micSelect.innerHTML = "";
				const option = document.createElement("option");
				option.value = "__none__";
				option.textContent = "no mic selected";
				micSelect.appendChild(option);
				selectedMicDeviceId = "__none__";
			}
		}

		micSelect.addEventListener("change", function () {
			selectedMicDeviceId = micSelect.value;
		});

		async function startGodotVoiceChat() {
			if (godotVoiceEnabled) {
				return true;
			}

			if (selectedMicDeviceId === "__none__") {
				godotVoiceEnabled = false;
				return true;
			}

			if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
				statusText.textContent = "* Microphone unavailable";
				return false;
			}

			if (typeof MediaRecorder === "undefined") {
				statusText.textContent = "* Voice chat unavailable in this browser";
				return false;
			}

			try {
				await unlockVoiceAudio();

				if (godotVoiceStream) {
					godotVoiceStream.getTracks().forEach(track => track.stop());
					godotVoiceStream = null;
				}

				const audioSettings = {
					echoCancellation: true,
					noiseSuppression: true,
					autoGainControl: true,
					channelCount: 1
				};

				if (selectedMicDeviceId && selectedMicDeviceId !== "__none__") {
					audioSettings.deviceId = { exact: selectedMicDeviceId };
				}

				godotVoiceStream = await navigator.mediaDevices.getUserMedia({
					audio: audioSettings,
					video: false
				});

				await populateMicrophoneSelect();

				const activeTrack = godotVoiceStream.getAudioTracks()[0];

				if (activeTrack && activeTrack.getSettings().deviceId) {
					selectedMicDeviceId = activeTrack.getSettings().deviceId;
					micSelect.value = selectedMicDeviceId;
				}

				const mimeType = getSupportedVoiceMimeType();
				const options = mimeType === "" ? {} : { mimeType: mimeType };

				godotVoiceRecorder = new MediaRecorder(godotVoiceStream, options);

				godotVoiceRecorder.ondataavailable = async function (event) {
					if (!event.data || event.data.size <= 0) {
						return;
					}

					try {
						const dataUrl = await blobToDataUrl(event.data);

						if (dataUrl !== "") {
							godotVoiceOutgoingPackets.push(dataUrl);

							if (godotVoiceOutgoingPackets.length > 12) {
								godotVoiceOutgoingPackets.shift();
							}
						}
					} catch (err) {
						console.error("[dreambox]", BUILD_TAG, "Voice packet encode failed:", err);
					}
				};

				godotVoiceRecorder.start(160);
				godotVoiceEnabled = true;
				return true;
			} catch (err) {
				console.error("[dreambox]", BUILD_TAG, "Voice chat failed:", err);
				statusText.textContent = "* Microphone blocked or unavailable";
				return false;
			}
		}

		function stopGodotVoiceChat() {
			godotVoiceEnabled = false;

			if (godotVoiceRecorder && godotVoiceRecorder.state !== "inactive") {
				try {
					godotVoiceRecorder.stop();
				} catch (err) {}
			}

			godotVoiceRecorder = null;

			if (godotVoiceStream) {
				godotVoiceStream.getTracks().forEach(track => track.stop());
				godotVoiceStream = null;
			}

			godotVoiceOutgoingPackets = [];
		}

		function getPeerVolume(peerId) {
			const local = godotVoicePositions[godotVoiceLocalId];
			const remote = godotVoicePositions[peerId];

			if (!local || !remote) {
				return godotVoiceBaseVolume;
			}

			const dx = Number(local.x || 0) - Number(remote.x || 0);
			const dy = Number(local.y || 0) - Number(remote.y || 0);
			const dz = Number(local.z || 0) - Number(remote.z || 0);
			const distance = Math.sqrt((dx * dx) + (dy * dy) + (dz * dz));

			if (distance <= godotVoiceMinDistance) {
				return godotVoiceBaseVolume;
			}

			if (distance >= godotVoiceMaxDistance) {
				return 0.0;
			}

			const t = (distance - godotVoiceMinDistance) / (godotVoiceMaxDistance - godotVoiceMinDistance);
			const eased = 1.0 - Math.min(1.0, Math.max(0.0, t));
			return eased * eased * godotVoiceBaseVolume;
		}

		function playGodotVoicePacket(peerId, packet) {
			if (!packet || peerId === "" || peerId === godotVoiceLocalId) {
				return;
			}

			const volume = getPeerVolume(peerId);

			if (volume <= 0.001) {
				return;
			}

			const audio = new Audio();
			audio.autoplay = true;
			audio.playsInline = true;
			audio.volume = Math.min(1.0, Math.max(0.0, volume));
			audio.src = packet;

			const playPromise = audio.play();

			if (playPromise && typeof playPromise.catch === "function") {
				playPromise.catch(() => {});
			}

			setTimeout(() => {
				audio.src = "";
			}, 3000);
		}

		window.startGodotVoiceChat = startGodotVoiceChat;
		window.stopGodotVoiceChat = stopGodotVoiceChat;
		window.testGodotAudio = testGodotAudio;

		window.startGodotProximityVoice = async function (localId) {
			godotVoiceLocalId = String(localId || "");

		};

		window.popGodotVoicePacket = function () {
			if (godotVoiceOutgoingPackets.length === 0) {
				return "";
			}

			return godotVoiceOutgoingPackets.shift();
		};

		window.playGodotVoicePacket = function (peerId, packet) {
			playGodotVoicePacket(String(peerId || ""), String(packet || ""));
		};

		window.receiveGodotVoicePacket = function (peerId, packet) {
			playGodotVoicePacket(String(peerId || ""), String(packet || ""));
		};

		window.setGodotVoicePositions = function (localId, positionsJson) {
			godotVoiceLocalId = String(localId || "");

			try {
				const parsed = JSON.parse(String(positionsJson || "{}"));

				if (parsed && typeof parsed === "object") {
					godotVoicePositions = parsed;
				}
			} catch (err) {
				godotVoicePositions = {};
			}
		};

		window.updateGodotVoicePositions = function (positions) {
			if (positions && typeof positions === "object") {
				godotVoicePositions = positions;
			}
		};

		window.setGodotVoiceConfig = function (minDistance, maxDistance, baseVolume) {
			godotVoiceMinDistance = Number(minDistance || godotVoiceMinDistance);
			godotVoiceMaxDistance = Number(maxDistance || godotVoiceMaxDistance);
			godotVoiceBaseVolume = Number(baseVolume || godotVoiceBaseVolume);
		};

		async function invokeGodotStart() {
			const name = nameInput.value.trim();

			if (!name || !selectedImageDataUrl) {
				updateStartState();
				return;
			}

			await unlockVoiceAudio();
			await testGodotAudio();

			if (selectedMicDeviceId !== "__none__") {
				await startGodotVoiceChat();
			}

			if (window.godotWebStart) {
				window.godotWebStart(name, selectedImageDataUrl, facecamCheckbox.checked, selectedMicDeviceId !== "__none__");
				overlay.style.display = "none";
			}
		}

		startButton.addEventListener("click", invokeGodotStart);

		window.startGodotFacecam = async function (width, height) {
			try {
				godotFaceSize = Math.max(32, width || 80);

				if (godotFaceStream) {
					godotFaceStream.getTracks().forEach(track => track.stop());
					godotFaceStream = null;
				}

				const stream = await navigator.mediaDevices.getUserMedia({
					video: {
						facingMode: "user",
						width: { ideal: 192 },
						height: { ideal: 192 },
						frameRate: { ideal: 8, max: 12 }
					},
					audio: false
				});

				godotFaceStream = stream;
				godotFaceVideo.srcObject = stream;
				await godotFaceVideo.play();

				godotFaceCanvas.width = godotFaceSize;
				godotFaceCanvas.height = godotFaceSize;
			} catch (err) {
				console.error("[dreambox]", BUILD_TAG, "Godot facecam failed:", err);
			}
		};

		window.captureGodotFacecamFrame = function () {
			if (!godotFaceVideo || !godotFaceStream) return "";
			if (godotFaceVideo.videoWidth === 0 || godotFaceVideo.videoHeight === 0) return "";

			const vw = godotFaceVideo.videoWidth;
			const vh = godotFaceVideo.videoHeight;
			const square = Math.min(vw, vh);
			const sx = Math.floor((vw - square) * 0.5);
			const sy = Math.floor((vh - square) * 0.5);

			godotFaceCtx.clearRect(0, 0, godotFaceSize, godotFaceSize);
			godotFaceCtx.drawImage(
				godotFaceVideo,
				sx, sy, square, square,
				0, 0, godotFaceSize, godotFaceSize
			);

			return godotFaceCanvas.toDataURL("image/jpeg", 0.45);
		};

		window.stopGodotFacecam = function () {
			if (godotFaceStream) {
				godotFaceStream.getTracks().forEach(track => track.stop());
				godotFaceStream = null;
			}

			if (godotFaceVideo) {
				godotFaceVideo.srcObject = null;
			}
		};

		document.getElementById("closeGuestbook").addEventListener("click", hideGuestbook);

		document.getElementById("prevPage").addEventListener("click", () => {
			if (currentPage > 1) {
				loadGuestbook(currentPage - 1);
			}
		});

		document.getElementById("nextPage").addEventListener("click", () => {
			if (currentPage < totalPages) {
				loadGuestbook(currentPage + 1);
			}
		});

		updateStartState();
		updatePaginationUI();
		populateMicrophoneSelect();

		if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
			navigator.mediaDevices.addEventListener("devicechange", populateMicrophoneSelect);
		}
